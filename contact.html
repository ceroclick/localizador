<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - CeroClick</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-size: 18px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #e8491d 3px solid;
        }
        header a {
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        header ul {
            padding: 0;
            margin: 0;
            list-style: none;
            overflow: hidden;
        }
        header li {
            float: left;
            display: inline;
            padding: 0 20px 0 20px;
        }
        header #branding {
            float: left;
        }
        header #branding h1 {
            margin: 0;
        }
        header nav {
            float: right;
            margin-top: 10px;
        }
        header .highlight, header .current a {
            color: #e8491d;
            font-weight: bold;
        }
        header a:hover {
            color: #cccccc;
            font-weight: bold;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            max-width: 800px;
            padding: 20px;
        }
        h2 {
            color: #444;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }
        .contact-form {
            background-color: #f4f4f4;
            padding: 30px;
            border-radius: 8px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .form-group {
            width: calc(50% - 10px);
        }
        .form-group input,
        .form-group select,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .contact-form textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 20px;
            resize: vertical;
        }
        .contact-form button {
            background-color: #35424a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
        }
        .contact-form button:hover {
            background-color: #e8491d;
        }
    </style>
</head>
<body>
       <header>
        <div class="container">
            <div id="branding">
                <h1><span class="highlight">Cero</span>Click</h1>
            </div>
            <nav>
                <ul>
                    <li class="current"><a href="index.html">Inicio</a></li>
                    <li><a href="about.html">Sobre Nosotros</a></li>
                    <li><a href="services.html">Servicios</a></li>
                    <li><a href="team.html">Equipo</a></li>
                    <li><a href="contact.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>Déjanos Un Mensaje Para Cualquier Consulta</h2>
        <p>Si tienes alguna pregunta, no dudes en contactarnos. Estamos aquí para ayudarte con cualquier duda o necesidad que tengas.</p>
        
        <form class="contact-form">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="nombre" placeholder="Nombre Completo" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Correo Electrónico" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="empresa" placeholder="Nombre de la Empresa">
                </div>
                <div class="form-group">
                    <input type="text" name="cargo" placeholder="Cargo">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <input type="tel" name="telefono" placeholder="Número de Teléfono">
                </div>
                <div class="form-group">
                    <select name="servicio">
                        <option value="">Seleccione el Servicio Deseado</option>
                        <option value="auditoria">Auditoría de Seguridad Ofensiva</option>
                        <option value="pentesting">Pentesting de Vanguardia</option>
                        <option value="evaluacion">Evaluación de Riesgos Personalizada</option>
                    </select>
                </div>
            </div>
            <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
            <button type="submit">Enviar Mensaje</button>
        </form>
    </div>
</body>
</html>
